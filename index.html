<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Aplicación Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Mi Aplicación Web</h1>
      <p>Bienvenido a una aplicación web interactiva con HTML, CSS y JS.</p>
    </header>
    <main>
      <section class="card">
        <h2>Contador Interactivo</h2>
        <div id="counter" class="counter-display">0</div>
        <div class="actions">
          <button id="btn-decrement" class="btn btn-secondary">- Disminuir</button>
          <button id="btn-reset" class="btn btn-outline">Reiniciar</button>
          <button id="btn-increment" class="btn btn-primary">+ Incrementar</button>
        </div>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 - Módulo 9 Git y GitHub</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
